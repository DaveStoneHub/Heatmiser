name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Protocol library host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/host -B build-host
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  ui-preview:
    name: UI preview screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (fetches LVGL)
        run: |
          cmake -S tools/ui_preview -B build-preview
          cmake --build build-preview -j
      - name: Render every screen
        run: mkdir -p ui-shots && ./build-preview/ui_preview ui-shots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-shots/

  # Decides whether the firmware needs building. A change that only touches
  # documentation (Markdown anywhere, or anything under docs/) skips it. This
  # is a job rather than paths-ignore so the firmware check reports "skipped"
  # instead of never appearing, which keeps required checks satisfied.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch, a force push or a missing base: build to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base ($BASE); building."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "Changed files:"; echo "$changed"
          code=$(echo "$changed" | grep -vE '(^docs/|\.md$)' | grep -c . || true)
          if [ "$code" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs only; skipping the firmware build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    name: ESP-IDF v6.1.1 build (esp32s3)
    needs: changes
    # Self-hosted runner (Linux or WSL2, with Docker). Never run code from a
    # fork's pull request on it.
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux]
    # One firmware build at a time on the runner; a newer push to the same
    # branch or PR cancels the older build.
    concurrency:
      group: firmware-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      IDF_VERSION: v6.1.1
      # Kept on the runner's disk between runs instead of uploaded to the
      # Actions cache: the compiler cache, and the component manager's cache
      # (esp-matter brings connectedhomeip, which is a large download).
      CI_CACHE: ${{ github.workspace }}/../../_heatmiser-ci-cache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare caches
        run: |
          mkdir -p "$CI_CACHE/ccache" "$CI_CACHE/components"
          docker pull -q espressif/idf:$IDF_VERSION
      - name: Build
        # Run as the runner's own user so build output in the workspace is
        # not root-owned, which would stop the next checkout cleaning it.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e IDF_CCACHE_ENABLE=1 \
            -e CCACHE_DIR=/ccache \
            -e CCACHE_MAXSIZE=5G \
            -e IDF_COMPONENT_CACHE_PATH=/components \
            -v "$GITHUB_WORKSPACE:/project" \
            -v "$CI_CACHE/ccache:/ccache" \
            -v "$CI_CACHE/components:/components" \
            -w /project \
            espressif/idf:$IDF_VERSION \
            bash -c "idf.py set-target esp32s3 && idf.py build && ccache -s"

  tools:
    name: PC tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frame helper matches the firmware's regression vector
        run: test "$(python tools/hm_frame.py read 1)" = "01 0A 81 00 00 00 FF FF 2C 09"
      - name: Soak logger parses a log
        run: python -m py_compile tools/soak_logger.py
