name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Protocol library host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S test/host -B build-host
      - name: Build
        run: cmake --build build-host
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  ui-preview:
    name: UI preview screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (fetches LVGL)
        run: |
          cmake -S tools/ui_preview -B build-preview
          cmake --build build-preview -j
      - name: Render every screen
        run: mkdir -p ui-shots && ./build-preview/ui_preview ui-shots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-shots/

  firmware:
    name: ESP-IDF ${{ matrix.idf }} build (esp32s3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: [v5.4.1, v6.1.1]
    steps:
      # A Matter build (connectedhomeip with debug info) needs more disk than
      # the runner has free; drop toolchains this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      # connectedhomeip is about 2,000 files; keep the compiler cache between runs.
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.idf }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.idf }}-
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: .
          extra_docker_args: -e IDF_CCACHE_ENABLE=1 -e CCACHE_DIR=/app/${{ github.repository }}/.ccache -e CCACHE_MAXSIZE=2G
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .ccache
          key: ccache-${{ matrix.idf }}-${{ github.sha }}

  tools:
    name: PC tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frame helper matches the firmware's regression vector
        run: test "$(python tools/hm_frame.py read 1)" = "01 0A 81 00 00 00 FF FF 2C 09"
      - name: Soak logger parses a log
        run: python -m py_compile tools/soak_logger.py
